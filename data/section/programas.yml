name: Programas
id: programas
boxes:
- title: Programas
  sub: de Entrenamiento
- box:
    cols: 3
    color: such
    fade_to: tl
    hs: 5
    label: Contacto
    pin: send
    slider: true
    time: 5
  boxes:
