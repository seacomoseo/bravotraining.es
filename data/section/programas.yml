  - title: GENERAL
    price: 60 €/mes
    icon: fitness_center
    url: '#programa-general'
    md: |
      - ::check:: Nivel intermedio/Rx
      - ::check:: Preparación general de entrenamiento
      - ::check:: Aplicación de entrenamiento ilimitada
      - ::check:: Sesiones de entrenamiento: 5/6 semanales
      - ::check:: Apoyo complementario a través de videos
      - ::check:: Entrevista inicial opcional
      - ::check:: Ajustes mensuales de la programación
      - ::check:: Grupo de whatssap privado
      - ::check:: Descuento en formaciones y promociones
    color: main-light
    fade: white
  - title: PERSONALIZADO
    price: 90 €/mes
    icon: genetics
    url: '#programa-personalizado'
    md: |
      - ::check:: Nivel adaptado al atleta
      - ::check:: Preparación personalizada de entrenamiento
      - ::check:: Aplicación de entrenamiento ilimitada
      - ::check:: Sesiones de entrenamiento: ilimitadas
      - ::check:: Apoyo complementario a través de videos
      - ::check:: Entrevista inicial y cierre de objetivos de temporada
      - ::check:: Revisión semanal de entrenamientos
      - ::check:: Corrección de vídeos
      - ::check:: Grupo de whatssap privado
      - ::check:: Descuento en formaciones y promociones
      - ::check:: Matrícula incluida
    color: main-light
  - title: PREMIUM
    price: 130 €/mes
    icon: rewarded_ads
    url: '#programa-premium'
    md: |
      - ::check:: Nivel adaptado al atleta
      - ::check:: Preparación individualizada de entrenamiento
      - ::check:: Aplicación de entrenamiento ilimitada
      - ::check:: Sesiones de entrenamiento: ilimitadas
      - ::check:: Apoyo complementario a través de videos
      - ::check:: Entrevista inicial y cierre de objetivos de temporada
      - ::check:: Revisión diaria de entrenamientos con feedback ilimitado
      - ::check:: Corrección de vídeos
      - ::check:: Grupo de whatssap privado
      - ::check:: Descuento en formaciones y promociones
      - ::check:: Plaza prioritaria para acceder al Training Camp
      - ::check:: Matrícula incluida
    color: main
    fade: main-dark
    fade_to: br
  - title: READAPTACIÓN DEPORTIVA
    price: 150 €/mes
    icon: physical_therapy
    url: '#programa-readaptacion-deportiva'
    md: |
      - ::check:: Entrevista inicial previo diagnóstico médico
      - ::check:: Evaluación inicial de sujeto mediante pruebas y test específicos para establecer el punto de partida
      - ::check:: Diseño del protocolo de trabajo individualizado
      - ::check:: Reintroducción paulatina al entrenamiento funcional
      - ::check:: Apoyo complementario a través de vídeos
      - ::check:: Sesiones ilimitadas de entrenamiento
      - ::check:: Revisión diaria de entrenamientos con feedback ilimitado
      - ::check:: Corrección de vídeos
      - ::check:: Grupo de whatssap privado
      - ::check:: Descuento en formaciones y promociones
      - ::check:: Plaza prioritaria para acceder al training camp
      - ::check:: Matrícula incluida
    color: dark
    fade: main-dark
  - title: BOXES Y CENTROS DEPORTIVOS
    price: 160 €/mes
    icon: groups
    url: '#programa-boxes-centros-deportivos'
    md: |
      - ::check:: Nivel adaptado al centro deportivo
      - ::check:: Preparación general de entrenamiento
      - ::check:: Aplicación de entrenamiento ilimitada
      - ::check:: Sesiones de entrenamiento: 5-6/semana
      - ::check:: Apoyo complementario a través de videos
      - ::check:: Entrevista inicial y cierre de objetivos de temporada
      - ::check:: Grupo de whatssap privado
      - ::check:: Descuento en formaciones y promociones
      - ::check:: Matrícula incluida
    color: main-light
    fade: white
