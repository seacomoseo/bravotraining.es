modal:
  size: xs
  color: white
  icon_pos: top
  inset: true
  caps: true
  line: true
modals:
- id: formacion-online-programacion-deportiva-cross-training
  title: Programación Deportiva
  sub: en Cross Training
  img: /u/formaciones-online/programacion-cross-training.jpg
  md: |
    El objetivo principal de esta formación es sentar las bases para que cualquier entrenador/a pueda organizar desde una sesión de entrenamiento hasta una periodización mayor en Cross Training y otras disciplinas deportivas.

    Entender los principios y leyes de entrenamiento, así como evaluar a un/a atleta servirán como motor para estructurar la temporada de manera correcta y eficaz. Basado en temporadas reales como atleta, entrenador y formador.

    #### Índice de contenidos

    - ::check:: Concepto y tipos de planificaciones deportivas. 
    - ::check:: ¿Cómo programar? Aspectos a tener en cuenta. 
    - ::check:: Vinculación con los factores y principios del entrenamiento.
    - ::check:: Fundamentos de los principales sistemas de entrenamiento. Vías de trabajo. 
    - ::check:: Elaboración del perfil fisiológico y mecánico del atleta.
    - ::check:: Pautas fundamentales para elaborar la micro y macroestructura. Reevaluación. 
    - ::check:: Feedback de la temporada y replanteamiento de nuevos objetivos
    - ::check:: Bloc de notas y supuesto práctico.
  ratio: 1/1
  inputs:
  - type: text
    name: Nombre
    req: true
  - type: mail
    name: Email
    req: true
  - type: area
    name: Mensaje
    req: true
- id: formacion-online-desarrollo-peaking-tapering-competicion-cross-training
  title: Desarrollo del Peaking y Tapering
  sub: para la Competición de Cross Training
  img: /u/formaciones-online/desarrollo-peaking-tapering-competicion-cross-training.jpg
  md: |
    El objetivo principal de esta formación es entender la competición deportiva y como encuadrarla dentro de la programación de Cross Training.

    Después de conceptualizar la competición y tratar de definir los aspectos relativos a la misma como son los entrenamientos, preparación de clasificatorios y semanas previas a la fecha diana, vamos a desgranar un bloque completo que constará de 6 semanas o microcilos para la puesta a punto mediante un peaking y tapering de elaboración propia y respaldado por bibliografía actualizada.

    #### Índice de contenidos

    - ::check:: Concepto y tipos de competición deportiva.
    - ::check:: Pirámide deportiva.
    - ::check:: Tipos de competición en Cross Training. Fitness Funcional.
    - ::check:: Requisitos recomendados para la competición.
    - ::check:: ¿Cómo entrenar para la competición? 
    - ::check:: Aspectos cuantitativos. Pre, intra y post-competición.
    - ::check:: Peaking y tapering competitivo. Esquema y desarrollo de 6 semanas. 
    - ::check:: Aspectos cualitativos. Factores psicológicos asociados al rendimiento deportivo.         
    - ::check:: Bloc de notas y supuesto práctico.
    - ::check:: Bibliografía.
  inputs:
  - type: text
    name: Nombre
    req: true
  - type: mail
    name: Email
    req: true
  - type: area
    name: Mensaje
    req: true
